# Ingress HTTP: expone la app fuera del cluster (requiere nginx-ingress/ingress-nginx instalado).
# Ajustar `host` y tls al dominio real.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: solomon
  namespace: solomon
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: solomon
                port:
                  number: 80