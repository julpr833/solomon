# Aplicacion web: pod con dos contenedores compartiendo codigo fuente via emptyDir.
#   initContainer "copy-code": copia el codigo ya compilado en la imagen PHP al volumen compartido.
#   container "web":  nginx, sirve /var/www/public y proxy a PHP-FPM (127.0.0.1:9000).
#   container "app":  php-fpm, ejecuta el codigo Laravel.
# La imagen debe construirse con docker/php/Dockerfile y publicarse en un registry
# (reemplazar ghcr.io/julpr833/solomon:latest por la imagen real en los 3 lugares).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solomon
  namespace: solomon
  labels:
    app: solomon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solomon
  template:
    metadata:
      labels:
        app: solomon
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: copy-code
          image: ghcr.io/julpr833/solomon:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - cp -a /var/www/. /shared/ && chown -R www-data:www-data /shared/storage /shared/bootstrap/cache
          volumeMounts:
            - name: shared
              mountPath: /shared
      containers:
        - name: web
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: shared
              mountPath: /var/www
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 250m
        - name: app
          image: ghcr.io/julpr833/solomon:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: solomon-config
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: solomon-secrets
                  key: app-key
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: solomon-secrets
                  key: db-name
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: solomon-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: solomon-secrets
                  key: db-password
          ports:
            - containerPort: 9000
              name: fpm
          volumeMounts:
            - name: shared
              mountPath: /var/www
          readinessProbe:
            tcpSocket:
              port: fpm
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: fpm
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: shared
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: nginx-config
---
# Service ClusterIP: puerta de entrada del pod web
apiVersion: v1
kind: Service
metadata:
  name: solomon
  namespace: solomon
  labels:
    app: solomon
spec:
  type: ClusterIP
  selector:
    app: solomon
  ports:
    - port: 80
      targetPort: http
      name: http