x-app: &app
  image: solomon-app:local
  network_mode: host
  environment:
    DB_HOST: 127.0.0.1
    DB_PORT: "3307"
    DB_DATABASE: ${DB_CONTAINER_DATABASE:-solomon}
    DB_USERNAME: ${DB_CONTAINER_USERNAME:-solomon}
    DB_PASSWORD: ${DB_CONTAINER_PASSWORD}
    WAHA_BASE_URL: http://127.0.0.1:3000
    WAHA_SESSION: ${WAHA_SESSION:-default}
  volumes:
    - .:/var/www
    - /var/www/storage
  depends_on:
    - db
    - waha
  restart: unless-stopped

services:
  app:
    <<: *app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      network: host
    container_name: solomon-app
  queue:
    <<: *app
    container_name: solomon-queue
    pull_policy: never
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
  scheduler:
    <<: *app
    container_name: solomon-scheduler
    pull_policy: never
    command: php artisan schedule:work
  nginx:
    image: nginx:alpine
    container_name: solomon-nginx
    network_mode: host
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: unless-stopped
  waha:
    image: devlikeapro/waha:latest
    container_name: solomon-waha
    network_mode: host
    environment:
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      - WHATSAPP_SWAGGER_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WHATSAPP_SWAGGER_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      - WHATSAPP_DEFAULT_ENGINE=WEBJS
    volumes:
      - waha_sessions:/app/.sessions
    restart: unless-stopped
  db:
    image: mysql:8.0
    container_name: solomon-db
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=${DB_CONTAINER_DATABASE:-solomon}
      - MYSQL_USER=${DB_CONTAINER_USERNAME:-solomon}
      - MYSQL_PASSWORD=${DB_CONTAINER_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    restart: unless-stopped

volumes:
  dbdata:
  waha_sessions:
